<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ page.title }} — Daily Insider Trading Report</title>
<meta name="description" content="Daily congressional stock trades, SEC Form 4 insider transactions, and 13F institutional holdings for top politicians, billionaires, and investment firms."/>
<style>
:root{
  --bg:#f3f6fa; --card:#ffffff; --ink:#16233a; --muted:#5c6f88;
  --accent:#0b5fff; --accent-dark:#0849c4;
  --buy:#0e7a3d; --buy-bg:#e7f6ec; --sell:#c03221; --sell-bg:#fdecea;
  --line:#dfe6f0;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:var(--accent)}
header.hero{background:linear-gradient(135deg,#081c36 0%,#0f3a75 100%);color:#fff;padding:2.4rem 1.25rem 1.8rem}
.hero-inner{max-width:980px;margin:0 auto}
.hero h1{margin:0 0 .35rem;font-size:1.75rem;letter-spacing:-.01em}
.hero .sub{margin:0 0 1rem;opacity:.88;font-size:1rem}
.hero nav{font-size:.9rem;opacity:.9}
.hero nav a{color:#a9c6ff;text-decoration:none}
.hero nav a:hover{text-decoration:underline}
.wrap{max-width:980px;margin:0 auto;padding:0 1.25rem 3.5rem}
main h1:first-child{display:none}
.lede{color:var(--muted);font-style:italic;margin:1.4rem 0 .4rem}
.tabs{display:flex;gap:.55rem;flex-wrap:wrap;margin:1.2rem 0 1.2rem}
.tab-btn{border:1px solid var(--line);background:var(--card);padding:.6rem 1.15rem;border-radius:999px;cursor:pointer;font-size:.95rem;color:var(--ink);transition:all .15s}
.tab-btn:hover{border-color:var(--accent);color:var(--accent)}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tab-btn .count{display:inline-block;min-width:1.5em;text-align:center;background:rgba(0,0,0,.08);border-radius:999px;font-size:.8em;padding:.05em .4em;margin-left:.45em}
.tab-btn.active .count{background:rgba(255,255,255,.25)}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fade .2s ease-in}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tab-panel h2{display:none}
.tab-panel ul{list-style:none;padding:0;margin:0;display:grid;gap:.7rem}
.tab-panel li{background:var(--card);border:1px solid var(--line);border-left:5px solid #9fb0c7;border-radius:10px;padding:.85rem 1.05rem;box-shadow:0 1px 2px rgba(16,35,58,.05)}
.tab-panel li.buy-side{border-left-color:var(--buy)}
.tab-panel li.sell-side{border-left-color:var(--sell)}
.tab-panel p{color:var(--muted)}
strong.buy{color:var(--buy);background:var(--buy-bg);padding:.1em .5em;border-radius:6px;font-size:.85em;letter-spacing:.02em}
strong.sell{color:var(--sell);background:var(--sell-bg);padding:.1em .5em;border-radius:6px;font-size:.85em;letter-spacing:.02em}
.tag-new{color:var(--buy);font-weight:700;font-size:.8em}
.tag-exit{color:var(--sell);font-weight:700;font-size:.8em}
footer.site{border-top:1px solid var(--line);margin-top:2.5rem;padding-top:1.2rem;color:var(--muted);font-size:.85rem}
footer.site hr{display:none}
@media(max-width:640px){.hero h1{font-size:1.35rem}.tab-btn{padding:.5rem .9rem;font-size:.88rem}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <h1>{{ page.title }}</h1>
    <p class="sub">Congressional trades · SEC Form 4 insider transactions · 13F institutional holdings</p>
    <nav><a href="{{ site.baseurl }}/">← All reports</a></nav>
  </div>
</header>
<div class="wrap">
  <main>
    {{ content }}
  </main>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="panels"></div>
  <footer class="site" id="site-footer"></footer>
</div>
<script>
(function(){
  var main = document.querySelector('main');
  // Pull the lede (italic intro line) out to sit above the tabs
  var lede = null;
  var first = main.firstElementChild;
  while (first && (first.tagName === 'H1' || first.tagName === 'P')) {
    var nxt = first.nextElementSibling;
    if (first.tagName === 'P' && !lede) { lede = first; lede.classList.add('lede'); }
    first = nxt;
    if (first && first.tagName === 'H2') break;
  }
  // Move <hr> and everything after it (methodology) into the footer
  var footer = document.getElementById('site-footer');
  var hr = main.querySelector('hr');
  if (hr) {
    var nodes = [], n = hr;
    while (n) { nodes.push(n); n = n.nextElementSibling; }
    nodes.forEach(function(x){ footer.appendChild(x); });
  }
  // Split remaining content into sections by H2
  var sections = [], cur = null;
  Array.prototype.slice.call(main.children).forEach(function(el){
    if (el === lede) return;
    if (el.tagName === 'H2') { cur = {title: el.textContent.replace(/^\d+\.\s*/, ''), nodes: []}; sections.push(cur); }
    else if (cur) cur.nodes.push(el);
  });
  var tabsEl = document.getElementById('tabs'), panelsEl = document.getElementById('panels');
  // Color-code buy/sell markers and tag NEW / EXITED
  function decorate(root){
    root.querySelectorAll('strong').forEach(function(s){
      var t = s.textContent.trim().toLowerCase();
      if (t === 'purchase' || t === 'buy') s.classList.add('buy');
      else if (t === 'sale' || t === 'sell') s.classList.add('sell');
      if (s.textContent.indexOf('[NEW]') === 0) s.classList.add('tag-new');
      if (s.textContent.indexOf('[EXITED]') === 0) s.classList.add('tag-exit');
    });
    root.querySelectorAll('li').forEach(function(li){
      if (li.querySelector('strong.buy')) li.classList.add('buy-side');
      else if (li.querySelector('strong.sell')) li.classList.add('sell-side');
    });
  }
  sections.forEach(function(sec, i){
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.setAttribute('role', 'tab');
    var n = sec.nodes.reduce(function(c, el){ return c + (el.tagName === 'UL' ? el.children.length : 0); }, 0);
    btn.innerHTML = sec.title + (n ? ' <span class="count">' + n + '</span>' : '');
    var panel = document.createElement('div');
    panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
    panel.setAttribute('role', 'tabpanel');
    sec.nodes.forEach(function(el){ panel.appendChild(el); });
    decorate(panel);
    btn.addEventListener('click', function(){
      tabsEl.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      panelsEl.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active'); panel.classList.add('active');
    });
    tabsEl.appendChild(btn); panelsEl.appendChild(panel);
  });
  if (lede) main.insertBefore(lede, main.firstChild);
})();
</script>
</body>
</html>
